name: Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: NuSMV Model Checking
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NuSMV
        shell: powershell
        run: |
          $url = "https://nusmv.fbk.eu/distrib/2.7.1/NuSMV-2.7.1-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile NuSMV.zip

      - name: Extract NuSMV
        shell: powershell
        run: |
          Expand-Archive -Path NuSMV.zip -DestinationPath nusmv
          $exe = Get-ChildItem -Path nusmv -Filter NuSMV.exe -Recurse |
                 Select-Object -First 1

          if (-not $exe) {
              throw "NuSMV.exe was not found!"
          }

          Write-Host "NuSMV found at: $($exe.FullName)"

      - name: Run model checking
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path nusmv -Filter NuSMV.exe -Recurse |
                 Select-Object -First 1

          $output = & $exe.FullName authentication.smv 2>&1
          $exitCode = $LASTEXITCODE

          $output | Tee-Object -FilePath verification.log

          if ($exitCode -ne 0) {
              throw "NuSMV exited with code $exitCode"
          }

      - name: Check verification results
        shell: powershell
        run: |
          $log = Get-Content verification.log -Raw

          $count = ([regex]::Matches($log, " is true")).Count

          Write-Host "Verified properties: $count"

          if ($count -ne 5) {
              Write-Host "Formal verification failed!"
              exit 1
          }

          Write-Host "All formal properties passed successfully."
